[pytest]
testpaths = tests
markers =
    live: hits the real Telegram Bot API with a real bot token. Never run in CI.
        Opt in explicitly with `pytest -m live`, and only after reading
        docs/DEV_SETUP.md's "Live tests" section - see the safety
        constraints there (a fresh scratch DB, never pm_chaser.db).
addopts = --strict-markers -m "not live"
