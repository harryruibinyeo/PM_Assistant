model:
  default: qwen/qwen3.6-35b-a3b
  provider: lmstudio
  base_url: http://localhost:1234/v1
memory:
  memory_enabled: false
  user_profile_enabled: false
  nudge_interval: 0
skills:
  creation_nudge_interval: 0
_config_version: 33
# Phase 3 (refactor/agent-prompts): pm-chaser now runs as two separate
# server instances from the same image/database, each advertising only
# the tools this profile's own task-chaser SKILL.md actually calls by
# name (confirmed by grepping it - exactly 5 of the 16 tools). This
# profile's instance is started with PM_CHASER_TOOL_PROFILE=pmchaser-bot;
# the port stays :18173, unchanged from before this split, since
# listener/chase_listener.py's PEEK_URL is hardcoded to it - only
# task-manager-bot's instance moved to a new port (:18174). See
# server/pmchaser/mcp/profiles.py for the exact tool list and
# BRANCH_TESTING.md for how to run both instances together.
mcp_servers:
  pm-chaser:
    url: http://localhost:18173/mcp
    enabled: true
# Same install-tree AGENTS.md leak documented on task-manager-bot's
# config.yaml (Hermes issue #64590) — the global terminal.cwd fallback
# resolves to ~/.hermes/hermes-agent and loads its 77KB contributor
# AGENTS.md as if it were this bot's project context. Pointed at this
# profile's own directory, which has none, so nothing loads.
terminal:
  cwd: /Users/threeporkchops/.hermes/profiles/pmchaser-bot
# Same fix as task-manager-bot's config.yaml, never applied here until now:
# this bot's whole toolset is small enough to never need the tool_search/
# tool_describe/tool_call discovery bridge. Caught it misbehaving for real
# on 2026-08-17 during a live test — instead of calling get_chase_plan
# directly, it routed through tool_search -> tool_describe -> tool_call,
# then called get_chase_plan a second time in the same run (only ever
# supposed to be called once — see task-chaser/SKILL.md's own pitfall about
# this). No visible harm that run, but it's the identical failure class
# task-manager-bot was fixed for. Disabling it removes the wrong path
# entirely instead of hoping the model doesn't wander into it.
tools:
  tool_search: false
# This bot only ever runs two fixed, unattended cron jobs (task-chaser,
# task-digest) — no live conversation, no file uploads, no user present to
# ask a clarifying question, no reason to browse the web or look at an
# image. All of Hermes's generic built-in toolsets were nonetheless being
# reprocessed on every 15-minute chase tick regardless — same bloat found
# and fixed on task-manager-bot (see that config.yaml), applied here for
# the same reason. `skills` is kept, since these two cron jobs' own skill
# content is what actually drives their procedure.
agent:
  disabled_toolsets:
    - computer_use
    - browser
    - session_search
    - delegation
    - code_execution
    - tts
    - todo
    - file
    - memory
    - terminal
    - vision
    - web
    - clarify

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
