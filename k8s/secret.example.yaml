# Template only — copy to secret.yaml and fill in the real token.
# secret.yaml is gitignored; this .example file is the one that's tracked.
apiVersion: v1
kind: Secret
metadata:
  name: pm-chaser-secrets
  namespace: pm-chaser
type: Opaque
stringData:
  # Employee-facing "chase" bot - telegram_send_message/telegram_get_updates.
  TELEGRAM_BOT_TOKEN: ""
  # S.A.M.'s own, separate bot - manager-facing, used only by
  # notify_manager(). Previously missing from this file entirely: a fresh
  # deploy from just this template would silently lose every escalation
  # and status notification to the manager, with no error surfaced beyond
  # notify_manager's own return value (see server/.env.example).
  TASK_MANAGER_BOT_TOKEN: ""
